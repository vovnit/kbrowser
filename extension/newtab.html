<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New tab</title>
<style>
  html, body { margin: 0; background: #fff; color: #000; font-family: "DejaVu Sans", sans-serif; }
  main { padding: 16px 12px 140px; max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 8px 0 14px; }
  form { display: flex; gap: 6px; }
  input { flex: 1; min-width: 0; font-size: 20px; height: 52px; padding: 0 10px; border: 2px solid #000; border-radius: 8px; }
  button { font-size: 20px; height: 52px; padding: 0 16px; border: 2px solid #000; border-radius: 8px; background: #fff; }
  button:active { background: #000; color: #fff; }
  h2 { font-size: 16px; margin: 22px 0 8px; text-transform: uppercase; letter-spacing: .05em; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .grid a { display: block; border: 1.5px solid #000; border-radius: 8px; padding: 12px 10px; color: #000;
            text-decoration: none; font-size: 17px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .grid a small { display: block; font-size: 12px; color: #444; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<main>
  <h1>Kindle browser</h1>
  <form id="f"><input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Search or type an address"><button>Go</button></form>
  <h2>Shortcuts</h2>
  <div class="grid" id="fixed"></div>
  <h2>Frequent</h2>
  <div class="grid" id="top"></div>
</main>
<script src="layouts.js"></script>
<script src="kit.js"></script>
<script src="newtab.js"></script>
</body>
</html>
