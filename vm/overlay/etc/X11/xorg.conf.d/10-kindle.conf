# Only used with KINDLE_DEPTH=24 (see /etc/init.d/kindle-x). Screen size as reported by
# X on a PW 2024 (1272x1696), no GPU acceleration.
Section "Device"
    Identifier "virtio"
    Driver     "modesetting"
    Option     "AccelMethod" "none"
    Option     "ShadowFB" "true"
EndSection

Section "Monitor"
    Identifier "eink"
    Modeline   "1272x1696" 20.00 1272 1276 1280 1284 1696 1698 1700 1702
    Option     "PreferredMode" "1272x1696"
    DisplaySize 105 140
EndSection

Section "Screen"
    Identifier "screen"
    Device     "virtio"
    Monitor    "eink"
    DefaultDepth 24
    SubSection "Display"
        Modes "1272x1696"
    EndSubSection
EndSection

# The QEMU tablet stands in for the touch panel (absolute single pointer).
Section "InputClass"
    Identifier "touch-as-tablet"
    MatchIsTablet "on"
    Driver "libinput"
EndSection

Section "ServerFlags"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
