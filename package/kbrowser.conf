# kbrowser settings. Copied to /mnt/us/kbrowser/kbrowser.conf on first run;
# edit that copy (over USB) - it overrides these defaults.

# chromium (faster, lighter on the Kindle) or firefox (ESR: full uBlock Origin, any Firefox add-on)
BROWSER=chromium

# auto:   direct on a 24-bit screen, kview otherwise (the Kindle's screen is 8-bit)
# kview:  browser draws on a private 24-bit screen, kview converts it to the Kindle's
# direct: browser window straight on the Kindle's X server (needs a 24-bit screen)
# xephyr: nested Xephyr (also needs a 24-bit screen)
MODE=auto

# kview: wait this many ms to collect screen changes before drawing (fewer e-ink flashes)
REFRESH_MS=80

# CSS pixel ratio. 2.0 = ~618 CSS px wide, like a large phone. 1.5 fits more text.
SCALE=2.0

# Stop the Kindle reader UI while browsing (frees ~100-150 MB, screen shows only
# the browser; the UI is restarted on exit). With 1 GB RAM this is optional.
STOP_FRAMEWORK=0

# "mobile" = send a phone user agent (lighter pages); empty = desktop; or a full UA string
USER_AGENT=

# Page opened at start (empty = Touch Kit start page)
START_URL=

# Chromium only: max renderer processes, and Chrome's low-end-device mode (0/1)
RENDERERS=2
LOW_END=0

# Size caps of the RAM-backed /tmp and /dev/shm inside the browser image, MB
# (RAM is only used as needed; Chromium keeps page/tab graphics in /dev/shm)
TMP_MB=128
SHM_MB=256

# Optional extra swap: path to a pre-made swap block image on /mnt/us (empty = off).
# The Kindle's own 128 MB zram swap is always used.
SWAP_IMAGE=

# Where the browser image lives
IMAGE=/mnt/us/kbrowser/kbrowser.ext3
DOWNLOADS=/mnt/us/documents/Downloads
