// kbrowser autoconfig (first line must be a comment).
// Firefox tuned for a Kindle: e-ink, touch, ~1 GB RAM, no GPU.
// Values the launcher controls come from the environment (see kbrowser.conf).

function envOr(name, dflt) { const v = getenv(name); return v ? v : dflt; }

// ---- display / touch ---------------------------------------------------------
defaultPref("layout.css.devPixelsPerPx", envOr("KBROWSER_SCALE", "2.0"));
defaultPref("browser.uidensity", 2);                 // "touch" density toolbar
defaultPref("browser.compactmode.show", false);
defaultPref("dom.w3c_touch_events.enabled", 1);
defaultPref("apz.allow_zooming", true);
defaultPref("apz.allow_double_tap_zooming", true);
defaultPref("browser.tabs.inTitlebar", 1);           // client-side close button (no WM decorations)
defaultPref("widget.gtk.overlay-scrollbars.enabled", false);
defaultPref("full-screen-api.warning.timeout", 0);
defaultPref("browser.fullscreen.autohide", true);  // fullscreen hides tabs + toolbar

// ---- e-ink: nothing that animates ---------------------------------------------
defaultPref("general.smoothScroll", false);
defaultPref("ui.prefersReducedMotion", 1);
defaultPref("toolkit.cosmeticAnimations.enabled", false);
defaultPref("layout.frame_rate", 10);                 // no point painting 60 fps on e-ink
defaultPref("image.animation_mode", envOr("KBROWSER_GIF", "once"));
defaultPref("media.autoplay.default", 5);             // block all autoplay
defaultPref("ui.caretBlinkTime", 0);                  // blinking caret = constant e-ink refresh
defaultPref("browser.display.use_system_colors", false);

// ---- memory / CPU (2x ~1 GHz armv7, 1 GB, zram) --------------------------------
defaultPref("fission.autostart", false);              // one content process per site is too many
defaultPref("dom.ipc.processCount", 2);
defaultPref("dom.ipc.processCount.webIsolated", 1);
defaultPref("dom.ipc.processPrelaunch.enabled", false);
defaultPref("browser.tabs.unloadOnLowMemory", true);
defaultPref("browser.low_commit_space_threshold_mb", 200);
defaultPref("browser.sessionhistory.max_total_viewers", 0);
defaultPref("browser.sessionstore.interval", 60000);  // fewer writes to flash
defaultPref("browser.startup.page", 3);                // reopen last tabs
defaultPref("browser.sessionstore.max_resumed_crashes", 99); // after a kill, restore silently (no about:sessionrestore)
defaultPref("browser.cache.memory.capacity", 16384);
defaultPref("browser.cache.disk.capacity", 102400);
defaultPref("gfx.webrender.software", true);
defaultPref("layers.acceleration.disabled", true);
defaultPref("media.hardware-video-decoding.enabled", false);
defaultPref("network.prefetch-next", false);
defaultPref("network.dns.disablePrefetch", true);
defaultPref("network.http.speculative-parallel-limit", 0);
defaultPref("browser.places.speculativeConnect.enabled", false);
defaultPref("browser.urlbar.speculativeConnect.enabled", false);
defaultPref("extensions.webextensions.remote", true);

// ---- quiet startup -------------------------------------------------------------
defaultPref("browser.shell.checkDefaultBrowser", false);
defaultPref("security.sandbox.warn_unprivileged_namespaces", false); // Kindle kernels have no user namespaces
defaultPref("browser.startup.homepage_override.mstone", "ignore");
defaultPref("browser.aboutwelcome.enabled", false);
defaultPref("trailhead.firstrun.didSeeAboutWelcome", true);
defaultPref("browser.newtabpage.activity-stream.feeds.section.topstories", false);
defaultPref("browser.newtabpage.activity-stream.showSponsored", false);
defaultPref("browser.newtabpage.activity-stream.showSponsoredTopSites", false);
defaultPref("extensions.pocket.enabled", false);
defaultPref("browser.translations.automaticallyPopup", false);
defaultPref("datareporting.healthreport.uploadEnabled", false);
defaultPref("toolkit.telemetry.enabled", false);
defaultPref("app.normandy.enabled", false);
defaultPref("app.update.auto", false);

// ---- extensions / downloads ----------------------------------------------------
defaultPref("xpinstall.signatures.required", false);  // honoured by ESR: lets the unsigned Touch Kit load
defaultPref("extensions.autoDisableScopes", 0);
defaultPref("browser.download.dir", envOr("KBROWSER_DOWNLOADS", "/mnt/us/documents/Downloads"));
defaultPref("browser.download.folderList", 2);
defaultPref("browser.download.useDownloadDir", true);

const ua = getenv("KBROWSER_UA");
if (ua === "mobile") {
  defaultPref("general.useragent.override",
    "Mozilla/5.0 (Android 14; Mobile; rv:140.0) Gecko/140.0 Firefox/140.0");
} else if (ua) {
  defaultPref("general.useragent.override", ua);
}

// ---- lab126 window title -------------------------------------------------------
// The Kindle WM decides where a window goes from its WM_NAME, read when the window
// is mapped. Firefox normally sets the title to "<page> — Mozilla Firefox"; pin it
// to the lab126 string for every browser window.
const WM_TITLE = getenv("KBROWSER_WM_TITLE");
if (WM_TITLE) {
  const pin = (win) => {
    const doc = win.document;
    if (!doc || doc.documentURI !== "chrome://browser/content/browser.xhtml") return;
    const root = doc.documentElement;
    for (const a of ["data-title-default", "data-title-private", "data-content-title-default",
                     "data-content-title-private", "titlemodifier", "titledefault"]) {
      root.setAttribute(a, WM_TITLE);
    }
    root.removeAttribute("data-l10n-id");
    Object.defineProperty(doc, "title", { configurable: true, get: () => WM_TITLE, set: () => {} });
    let t = doc.querySelector("title");
    if (!t) { t = doc.createElementNS("http://www.w3.org/1999/xhtml", "title"); (doc.head || root).prepend(t); }
    t.removeAttribute("data-l10n-id");
    t.textContent = WM_TITLE;
    // Localization may still rewrite <title>; put it back each time.
    new win.MutationObserver(() => { if (t.textContent !== WM_TITLE) t.textContent = WM_TITLE; })
      .observe(t, { childList: true, characterData: true, subtree: true });
  };
  Services.obs.addObserver((win) => {
    win.addEventListener("DOMContentLoaded", () => pin(win), { once: true });
  }, "chrome-document-global-created");
}

// ---- fullscreen toggle from the Touch Kit ---------------------------------------
// The extension can't make Firefox go fullscreen (windows.update state changes are
// ignored in this setup), but it can set a window title preface. Watch for it and
// toggle fullscreen exactly like F11.
Services.obs.addObserver((win) => {
  win.addEventListener("DOMContentLoaded", () => {
    const doc = win.document;
    if (!doc || doc.documentURI !== "chrome://browser/content/browser.xhtml") return;
    const root = doc.documentElement;
    new win.MutationObserver(() => {
      const v = root.getAttribute("titlepreface") || "";
      if (!v.startsWith("kbrowser-fullscreen:")) return;
      root.setAttribute("titlepreface", "");
      win.fullScreen = !win.fullScreen;
    }).observe(root, { attributes: true, attributeFilter: ["titlepreface"] });
  }, { once: true });
}, "chrome-document-global-created");
