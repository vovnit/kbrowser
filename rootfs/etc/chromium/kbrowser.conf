# Sourced by /usr/bin/chromium (Alpine wrapper) after chromium.conf.
# Chromium tuned for a Kindle: e-ink, touch, ~1 GB RAM, no GPU, no user namespaces.
CHROMIUM_FLAGS="$CHROMIUM_FLAGS
  --no-sandbox --test-type
  --no-first-run --no-default-browser-check --disable-sync --hide-crash-restore-bubble
  --password-store=basic
  --force-device-scale-factor=${KBROWSER_SCALE:-2}
  --top-chrome-touch-ui=enabled
  --touch-events=enabled
  --disable-smooth-scrolling
  --disable-gpu --disable-gpu-compositing
  --renderer-process-limit=${KBROWSER_RENDERERS:-2}
  --process-per-site
  --disk-cache-size=104857600
  --autoplay-policy=user-gesture-required
  --disable-component-update
  --disable-features=DisableLoadExtensionCommandLineSwitch,MediaRouter,OptimizationHints,Translate,BackForwardCache
  --enable-features=OverlayScrollbar
  --load-extension=/opt/kbrowser/touchkit
"
[ "${KBROWSER_LOWEND:-0}" = 1 ] && CHROMIUM_FLAGS="$CHROMIUM_FLAGS --enable-low-end-device-mode"
# User agent and --window-name contain spaces/quotes: kbrowser-session passes them as argv.
